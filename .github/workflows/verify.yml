name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked

      # The pipeline tests run offline; this proves the committed artifact
      # itself is signed, intact, and matches the snapshots in data/.
      - name: verify the committed chain
        run: |
          if [ -f fedramp.aion ]; then
            cargo run --release --locked -- verify
          else
            echo 'no chain committed yet — genesis has not run'
          fi
