name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This org permits GitHub-owned actions only; the toolchain therefore
      # comes from the runner's rustup rather than a third-party action.
      - name: rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup component add clippy rustfmt

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked

      # The pipeline tests run offline; this proves the committed artifact
      # itself is signed, intact, and matches the snapshots in data/.
      - name: verify the committed chain
        run: |
          if [ -f fedramp.aion ]; then
            cargo run --release --locked -- verify
          else
            echo 'no chain committed yet — genesis has not run'
          fi
